<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Program">
<meta name="theme-color" content="#16181c">
<title>Program Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316181c'/%3E%3Crect x='8' y='29' width='48' height='6' fill='%238b9099'/%3E%3Crect x='12' y='19' width='7' height='26' fill='%23c8443c'/%3E%3Crect x='45' y='19' width='7' height='26' fill='%23c8443c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Bebas+Neue&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;600&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel-900:#16181c; --steel-850:#1a1d22; --steel-800:#1e2127;
  --steel-750:#242830; --steel-700:#2e333d;
  --chalk:#e8e6e1; --zinc:#8b9099; --zinc-dim:#5f656e;
  --iron:#c8443c; --iron-rgb:200,68,60;
  --brass:#c9a227; --brass-rgb:201,162,39;
  --moss:#4f8a5e;
  --gauge:'Saira Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--steel-900);color:var(--chalk);font-family:var(--body);
  font-size:15px;line-height:1.4;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none !important}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--zinc-dim)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--steel-900);
  border-bottom:1px solid var(--steel-700);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 0}
.hdr-top{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.mark{font-family:var(--gauge);font-weight:900;font-size:20px;letter-spacing:.04em;
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:44vw}
.mark span{color:var(--iron)}
.hdr-spacer{flex:1 1 auto}
.icon-btn{width:38px;height:38px;border-radius:6px;display:flex;flex:0 0 auto;
  align-items:center;justify-content:center;background:var(--steel-800);
  border:1px solid var(--steel-700);font-size:16px;color:var(--zinc)}
.icon-btn:active{background:var(--steel-750)}
.icon-btn.flag{border-color:var(--brass);color:var(--brass)}

.hdr-rows{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.row-lbl{display:flex;align-items:center;gap:10px}
.row-lbl .eyebrow{flex:0 0 42px}
.row-lbl .seg{flex:1 1 auto}
.seg{display:flex;background:var(--steel-800);border:1px solid var(--steel-700);
  border-radius:6px;overflow-x:auto}
.seg button{flex:1 1 0;min-width:44px;min-height:38px;padding:0 8px;font-family:var(--mono);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--zinc);border-right:1px solid var(--steel-700)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--iron);color:#fff}
.ticks{height:7px;background-image:repeating-linear-gradient(to right,
  var(--steel-700) 0 1px,transparent 1px 9px);background-position:bottom left;
  border-bottom:1px solid var(--steel-700)}

/* banner */
.banner{margin:0 0 4px;padding:10px 12px;border-radius:6px;
  background:rgba(var(--brass-rgb),.12);border:1px solid rgba(var(--brass-rgb),.4);
  font-size:12px;color:var(--brass)}
.banner b{display:block;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}

/* cards */
main{padding:var(--pad);display:flex;flex-direction:column;gap:14px}
.card{background:var(--steel-850);border:1px solid var(--steel-700);
  border-radius:8px;overflow:hidden}
.card-hd{display:flex;align-items:baseline;gap:8px;padding:12px 14px 10px;
  border-bottom:1px solid var(--steel-700)}
.lift-name{font-family:var(--gauge);font-weight:700;font-size:24px;
  letter-spacing:.05em;text-transform:uppercase;line-height:1}
.card-hd .rm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--zinc);
  text-align:right}
.card-hd .rm b{color:var(--chalk);font-weight:600}
.tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 6px;border-radius:3px;
  background:var(--steel-750);color:var(--zinc)}
.tag.warn{background:rgba(var(--brass-rgb),.16);color:var(--brass)}

/* set rows */
.acthd{display:flex;justify-content:flex-end;padding:9px 14px 2px}
.setwrap{border-bottom:1px solid var(--steel-750)}
.setwrap:last-child{border-bottom:0}
.setwrap.amrap{background:var(--steel-800);border-left:3px solid var(--brass)}
.set{display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap}
.set-l{flex:1 1 auto;min-width:0}
.line1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pct{font-family:var(--mono);font-size:11px;color:var(--zinc-dim)}
.wt{font-family:var(--gauge);font-weight:700;font-size:28px;line-height:1}
.wt em{font-style:normal;font-size:12px;color:var(--zinc);margin-left:3px;
  font-family:var(--mono)}
.alt{display:block;font-family:var(--mono);font-size:11px;
  color:var(--zinc-dim);margin-top:3px}
.reps{font-family:var(--gauge);font-weight:700;font-size:18px;color:var(--zinc);
  letter-spacing:.04em}
.setwrap.amrap .reps{color:var(--brass)}
.set-inputs{flex:1 1 100%;display:flex;gap:8px}
.fl{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:0}
input.act{width:100%;height:40px;padding:0 6px;text-align:center;
  background:var(--steel-900);border:1px solid var(--steel-700);border-radius:6px;
  font-family:var(--gauge);font-weight:700;font-size:18px}
input.act::placeholder{font-family:var(--mono);font-size:10px;font-weight:400;
  letter-spacing:.06em;text-transform:uppercase;color:var(--zinc-dim)}
input.act:focus{outline:2px solid var(--iron);outline-offset:-1px}
input.act.filled{border-color:var(--brass)}
.stat{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--zinc-dim);padding:0 14px 9px;text-align:right}
.stat.saved{color:var(--moss)}

.btn{min-height:40px;padding:0 14px;border-radius:6px;background:var(--iron);
  color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase}
.btn:active{filter:brightness(.88)}
.btn.ghost{background:var(--steel-750);color:var(--chalk);
  border:1px solid var(--steel-700)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}

.notice{border:1px dashed var(--steel-700);border-radius:8px;padding:24px 16px;
  text-align:center;color:var(--zinc)}
.notice b{display:block;color:var(--chalk);font-family:var(--gauge);font-size:22px;
  letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.notice p{margin:6px 0}
.hint{font-size:12px;color:var(--zinc);margin:7px 0 0}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,7,9,.68)}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;
  overflow-y:auto;background:var(--steel-900);border-top:1px solid var(--steel-700);
  border-radius:14px 14px 0 0;
  padding:0 var(--pad) calc(28px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.drawer-hd{position:sticky;top:0;background:var(--steel-900);display:flex;
  align-items:center;gap:10px;padding:16px 0 12px;
  border-bottom:1px solid var(--steel-700);margin-bottom:4px}
.drawer-hd h2{margin:0;font-family:var(--gauge);font-weight:700;font-size:22px;
  letter-spacing:.06em;text-transform:uppercase}
.drawer-hd .icon-btn{margin-left:auto}
.field{padding:12px 0;border-bottom:1px solid var(--steel-750)}
.field:last-child{border-bottom:0}
.field .eyebrow{display:block;margin-bottom:7px}
.maxrow{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--steel-750)}
.maxrow .nm{font-family:var(--gauge);font-weight:700;font-size:18px;
  letter-spacing:.05em;text-transform:uppercase;flex:1 1 auto}
.maxrow input{flex:0 0 104px;min-height:44px;padding:0 10px;
  background:var(--steel-800);border:1px solid var(--steel-700);border-radius:6px;
  font-family:var(--gauge);font-weight:700;font-size:21px;text-align:center}
.maxrow input:focus{outline:2px solid var(--iron);outline-offset:-1px}
.maxrow .cv{flex:0 0 66px;text-align:right;font-family:var(--mono);
  font-size:11px;color:var(--zinc-dim)}
input[type="color"]{-webkit-appearance:none;appearance:none;width:52px;height:40px;
  padding:2px;background:var(--steel-800);border:1px solid var(--steel-700);
  border-radius:6px;cursor:pointer}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:0;border-radius:4px}

/* video */
.video-toggle{margin:10px 14px 0;display:inline-flex;align-items:center;gap:6px}
.video-wrap{position:relative;width:100%;padding-top:56.25%;height:0;margin:10px 14px 0;
  border-radius:6px;overflow:hidden;background:var(--steel-900)}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card > .video-toggle:last-child,.card > .video-wrap:last-child{margin-bottom:12px}

.hgroup{padding:12px 0;border-bottom:1px solid var(--steel-750)}
.hgroup h3{margin:0 0 8px;font-family:var(--gauge);font-weight:700;font-size:18px;
  letter-spacing:.05em;text-transform:uppercase}
.hrow{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);
  font-size:12px;color:var(--zinc);padding:5px 0;flex-wrap:wrap}
.hrow .hd{flex:0 0 auto;color:var(--zinc-dim)}
.hrow .hw{font-family:var(--gauge);font-weight:700;font-size:17px;color:var(--chalk)}
.hrow .hr{color:var(--brass);font-weight:600}
.hrow .hp{margin-left:auto;color:var(--zinc-dim)}

textarea{width:100%;min-height:110px;padding:10px;background:var(--steel-800);
  border:1px solid var(--steel-700);border-radius:6px;font-family:var(--mono);
  font-size:11px;color:var(--chalk);resize:vertical}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 0;text-align:center;min-width:120px}
.danger{color:var(--iron)}
.filepick{display:block;width:100%;padding:10px;background:var(--steel-800);
  border:1px dashed var(--steel-700);border-radius:6px;font-family:var(--mono);
  font-size:11px;color:var(--zinc)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:60;background:var(--chalk);color:var(--steel-900);
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:11px 16px;border-radius:6px;max-width:88vw;
  text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.6}}
}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="mark" id="progTitle">Program</div>
    <div class="hdr-spacer"></div>
    <button class="icon-btn" id="btnHist" aria-label="History">&#9711;</button>
    <button class="icon-btn" id="btnSet" aria-label="Settings">&#9881;</button>
  </div>
  <div class="hdr-rows" id="navRows"></div>
  <div class="ticks"></div>
</header>

<main id="main"></main>
<div id="layer"></div>

<script>
"use strict";

/* ============================================================
   STORAGE
   ============================================================ */
const KEY = "workout-program-v1";
const Store = {
  async get(){
    if (window.storage){
      try { const r = await window.storage.get(KEY); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try { return localStorage.getItem(KEY); } catch(e){ return null; }
  },
  async set(v){
    if (window.storage){
      try { await window.storage.set(KEY, v); return true; } catch(e){ return false; }
    }
    try { localStorage.setItem(KEY, v); return true; } catch(e){ return false; }
  }
};

/* ============================================================
   CONSTANTS
   ============================================================ */
const INC = { lb:5, kg:2.5 };
const LB_PER_KG = 2.20462;

const FONT_PRESETS = {
  classic:{ label:"Classic", gauge:"'Saira Condensed','Arial Narrow',sans-serif",
    body:"'IBM Plex Sans',-apple-system,sans-serif", mono:"'IBM Plex Mono',monospace" },
  modern:{ label:"Modern", gauge:"'Oswald','Arial Narrow',sans-serif",
    body:"'Inter',-apple-system,sans-serif", mono:"'JetBrains Mono',monospace" },
  bold:{ label:"Bold", gauge:"'Bebas Neue','Arial Narrow',sans-serif",
    body:"'Roboto',sans-serif", mono:"'Roboto Mono',monospace" },
  slab:{ label:"Slab", gauge:"'Bebas Neue','Arial Narrow',sans-serif",
    body:"'Roboto Slab',serif", mono:"'IBM Plex Mono',monospace" }
};
const DEFAULT_THEME = { accent:"#c8443c", highlight:"#c9a227", font:"classic" };

const SAMPLE_CSV =
"week,day,lift,order,pct,reps,video\n" +
"1,1,Squat,1,65,5,\n" +
"1,1,Squat,2,75,5,\n" +
"1,1,Squat,3,85,5+,https://www.youtube.com/watch?v=nADbFEZUYfE\n" +
"1,1,Bench Press,1,65,5,\n" +
"1,1,Bench Press,2,75,5\n" +
"1,1,Bench Press,3,85,5+\n" +
"1,1,Ab Wheel,1,,10-15\n" +
"1,2,Deadlift,1,65,5\n" +
"1,2,Deadlift,2,75,5\n" +
"1,2,Deadlift,3,85,5+\n" +
"1,2,Overhead Press,1,65,5\n" +
"1,2,Overhead Press,2,75,5\n" +
"1,2,Overhead Press,3,85,5+\n" +
"2,1,Squat,1,70,3\n" +
"2,1,Squat,2,80,3\n" +
"2,1,Squat,3,90,3+\n" +
"2,1,Bench Press,1,70,3\n" +
"2,1,Bench Press,2,80,3\n" +
"2,1,Bench Press,3,90,3+\n" +
"2,2,Deadlift,1,70,3\n" +
"2,2,Deadlift,2,80,3\n" +
"2,2,Deadlift,3,90,3+\n" +
"2,2,Overhead Press,1,70,3\n" +
"2,2,Overhead Press,2,80,3\n" +
"2,2,Overhead Press,3,90,3+\n";

/* ============================================================
   STATE
   ============================================================ */
const BACKUP_REMIND_DAYS = 14;

const fresh = () => ({
  v:1, units:"lb",
  programName:"", program:[],       /* [{week,day,lift,order,pct|null,reps}] */
  cycle:1, week:1, day:1,
  max:{},                           /* lift name -> number */
  actual:{},                        /* setKey -> {w,r} typed values */
  log:{},                           /* setKey -> {lift,week,day,order,w,r,p,u,date,cycle} */
  lastBackup:null,                  /* ms timestamp of last export/download, or null */
  theme:Object.assign({}, DEFAULT_THEME)
});
let S = fresh();

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function roundW(w,u){ const i = INC[u]; return Math.round(w/i)*i; }
function fmt(w){ return (Math.round(w*100)/100).toString(); }
function other(u){ return u === "lb" ? "kg" : "lb"; }
function conv(w, from){
  if (!w) return 0;
  return Math.round((from === "lb" ? w/LB_PER_KG : w*LB_PER_KG) * 10) / 10;
}
function setWeight(max, pct){ return roundW(max * pct / 100, S.units); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"_"); }

/* ============================================================
   THEME
   ============================================================ */
function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  return m ? (parseInt(m[1],16)+","+parseInt(m[2],16)+","+parseInt(m[3],16)) : "200,68,60";
}
function applyTheme(){
  const t = Object.assign({}, DEFAULT_THEME, S.theme);
  const r = document.documentElement.style;
  r.setProperty("--iron", t.accent);
  r.setProperty("--iron-rgb", hexToRgb(t.accent));
  r.setProperty("--brass", t.highlight);
  r.setProperty("--brass-rgb", hexToRgb(t.highlight));
  const f = FONT_PRESETS[t.font] || FONT_PRESETS.classic;
  r.setProperty("--gauge", f.gauge);
  r.setProperty("--body", f.body);
  r.setProperty("--mono", f.mono);
}

/* ============================================================
   VIDEO EMBED
   ============================================================ */
function embedURL(url){
  url = (url || "").trim();
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([\w-]{6,})/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  m = url.match(/vimeo\.com\/(\d+)/);
  if (m) return "https://player.vimeo.com/video/" + m[1];
  return url;
}
function firstVideo(rows){
  const r = rows.find(function(r){ return r.video; });
  return r ? r.video : null;
}

function toast(m){
  const o = $(".toast"); if (o) o.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function pressed(seg, attr, val){
  if (!seg) return;
  $$("button", seg).forEach(b =>
    b.setAttribute("aria-pressed", b.dataset[attr] === String(val)));
}

/* ============================================================
   BACKUP STATUS
   ============================================================ */
function hasAnyData(){
  return S.program.length > 0 || Object.keys(S.log).length > 0
    || Object.keys(S.max).some(function(k){ return S.max[k]; });
}
function daysSinceBackup(){
  if (!S.lastBackup) return null;
  return Math.floor((Date.now() - S.lastBackup) / 86400000);
}
function backupDue(){
  if (!hasAnyData()) return false;
  const d = daysSinceBackup();
  return d === null || d >= BACKUP_REMIND_DAYS;
}
function backupStatusText(){
  const d = daysSinceBackup();
  if (d === null) return "Never backed up";
  if (d === 0) return "Backed up today";
  return "Backed up " + d + " day" + (d === 1 ? "" : "s") + " ago";
}

/* ============================================================
   CSV PARSING
   ============================================================ */
function parseCSVText(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip, \n handles the break */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

const COL_ALIASES = {
  week:["week","wk"], day:["day"],
  lift:["lift","exercise","movement","name"],
  order:["order","set","setnumber","seq","sequence"],
  pct:["pct","percent","percentage","%"],
  reps:["reps","rep","target"],
  video:["video","videourl","video_url","link","url"]
};

function loadProgramCSV(text){
  const rows = parseCSVText(text);
  if (!rows.length) return { error:"That file has no rows in it." };
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {};
  Object.keys(COL_ALIASES).forEach(function(key){
    const i = header.findIndex(function(h){ return COL_ALIASES[key].indexOf(h) >= 0; });
    if (i >= 0) idx[key] = i;
  });
  const missing = ["week","day","lift","reps"].filter(function(k){ return idx[k] === undefined; });
  if (missing.length){
    return { error:"Missing column" + (missing.length>1?"s":"") + ": " + missing.join(", ") +
      ". The first row needs headers: week, day, lift, order, pct, reps." };
  }
  const out = [];
  let skipped = 0;
  for (let r=1;r<rows.length;r++){
    const row = rows[r];
    const week = parseInt(row[idx.week],10);
    const day = parseInt(row[idx.day],10);
    const lift = (row[idx.lift] || "").trim();
    const reps = (row[idx.reps] || "").trim();
    if (!week || !day || !lift || !reps){ skipped++; continue; }
    const pctRaw = idx.pct !== undefined ? (row[idx.pct] || "").trim() : "";
    let pct = pctRaw === "" ? null : parseFloat(pctRaw);
    if (pct !== null && isNaN(pct)) pct = null;
    const orderRaw = idx.order !== undefined ? (row[idx.order] || "").trim() : "";
    let order = orderRaw === "" ? null : parseFloat(orderRaw);
    if (order === null || isNaN(order)) order = out.length;
    const video = idx.video !== undefined ? (row[idx.video] || "").trim() : "";
    out.push({ week:week, day:day, lift:lift, order:order, pct:pct, reps:reps, video:video||null });
  }
  if (!out.length) return { error:"No usable rows found. Every row needs week, day, lift and reps filled in." };
  return { rows:out, skipped:skipped };
}

/* ============================================================
   PROGRAM QUERIES
   ============================================================ */
function weeksInProgram(){
  const s = {}; S.program.forEach(function(r){ s[r.week] = true; });
  return Object.keys(s).map(Number).sort(function(a,b){ return a-b; });
}
function daysInWeek(week){
  const s = {};
  S.program.forEach(function(r){ if (r.week === week) s[r.day] = true; });
  return Object.keys(s).map(Number).sort(function(a,b){ return a-b; });
}
function liftsInProgram(){
  const seen = {}, out = [];
  S.program.forEach(function(r){ if (!seen[r.lift]){ seen[r.lift]=1; out.push(r.lift); } });
  return out;
}
function rowsFor(week, day){
  return S.program.filter(function(r){ return r.week===week && r.day===day; })
    .slice().sort(function(a,b){ return a.order - b.order; });
}
function groupByLift(rows){
  const order = [], map = {};
  rows.forEach(function(r){
    if (!map[r.lift]){ map[r.lift] = []; order.push(r.lift); }
    map[r.lift].push(r);
  });
  return order.map(function(l){ return { lift:l, rows:map[l] }; });
}
function ensureValidWeekDay(){
  const wks = weeksInProgram();
  if (!wks.length) return;
  if (wks.indexOf(S.week) < 0) S.week = wks[0];
  const dys = daysInWeek(S.week);
  if (dys.length && dys.indexOf(S.day) < 0) S.day = dys[0];
}

/* ============================================================
   KEYS / LOGGING
   ============================================================ */
function setKey(row){
  return "c"+S.cycle+"_w"+row.week+"_d"+row.day+"_"+slug(row.lift)+"_o"+row.order;
}
function syncEntry(row){
  const k = setKey(row);
  const a = S.actual[k] || {};
  const r = (a.r || "").trim();
  if (r === ""){ delete S.log[k]; return; }
  const prev = S.log[k];
  const d = new Date();
  S.log[k] = {
    lift:row.lift, week:row.week, day:row.day, order:row.order,
    w:(a.w || "").trim(), r:r, p:row.reps, pct:row.pct, u:S.units,
    date:(prev ? prev.date : (d.getMonth()+1) + "/" + d.getDate()),
    cycle:S.cycle
  };
}

/* ============================================================
   PERSIST
   ============================================================ */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await Store.set(JSON.stringify(S));
    if (!ok) toast("Could not save");
  }, 150);
}
async function load(){
  const raw = await Store.get();
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d && d.v === 1 && Array.isArray(d.program)){
      S = d;
      if (!S.max) S.max = {};
      if (!S.actual) S.actual = {};
      if (!S.log) S.log = {};
      if (S.lastBackup === undefined) S.lastBackup = null;
      if (!S.theme) S.theme = Object.assign({}, DEFAULT_THEME);
      ensureValidWeekDay();
    }
  } catch(e){}
}

/* ============================================================
   CSV LOAD HANDLING
   ============================================================ */
function applyCSV(text, name){
  const res = loadProgramCSV(text);
  if (res.error){ toast(res.error); return; }
  S.program = res.rows;
  S.programName = name || "";
  const wks = weeksInProgram();
  S.week = wks.length ? wks[0] : 1;
  const dys = wks.length ? daysInWeek(S.week) : [];
  S.day = dys.length ? dys[0] : 1;
  save(); closeDrawer(); render();
  toast("Loaded " + res.rows.length + " rows"
    + (res.skipped ? " (" + res.skipped + " skipped)" : ""));
}
function downloadSample(){
  const blob = new Blob([SAMPLE_CSV], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "sample-program.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function downloadBackup(){
  S.lastBackup = Date.now();
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
    + "-" + String(d.getDate()).padStart(2,"0");
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "workout-backup-" + stamp + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  save(); render();
  toast("Backup downloaded");
}
function restoreFromData(d){
  if (!d || !Array.isArray(d.program)) throw new Error("shape");
  S = d;
  if (!S.max) S.max = {}; if (!S.actual) S.actual = {}; if (!S.log) S.log = {};
  if (S.lastBackup === undefined) S.lastBackup = null;
  if (!S.theme) S.theme = Object.assign({}, DEFAULT_THEME);
  ensureValidWeekDay();
  applyTheme();
  save(); closeDrawer(); render();
  toast("Backup restored");
}

/* ============================================================
   EVENTS — clicks
   ============================================================ */
document.addEventListener("click", function(ev){
  const t = ev.target.closest("button, [data-close]");
  if (!t || t.disabled) return;

  if (t.dataset.close){ closeDrawer(); return; }
  if (t.dataset.w){ S.week = +t.dataset.w; S.day = daysInWeek(S.week)[0] || S.day; save(); render(); return; }
  if (t.dataset.d){ S.day = +t.dataset.d; save(); render(); return; }

  if (t.dataset.video !== undefined){
    const src = embedURL(t.dataset.video);
    const wrap = document.createElement("div");
    wrap.className = "video-wrap";
    wrap.innerHTML = '<iframe src="'+esc(src)+'" allow="accelerometer; autoplay; clipboard-write; '
      + 'encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
    t.replaceWith(wrap);
    return;
  }

  if (t.id === "btnSet"){ settingsDrawer(); return; }
  if (t.id === "btnHist"){ historyDrawer(); return; }
  if (t.id === "fUploadEmpty"){ settingsDrawer(); setTimeout(function(){ $("#fCsvFile").click(); }, 50); return; }

  if (t.dataset.font){
    S.theme = Object.assign({}, DEFAULT_THEME, S.theme, { font:t.dataset.font });
    applyTheme(); save(); settingsDrawer();
    return;
  }
  if (t.id === "fThemeReset"){
    S.theme = Object.assign({}, DEFAULT_THEME);
    applyTheme(); save(); settingsDrawer(); toast("Appearance reset");
    return;
  }
  if (t.closest("#fUnits")){
    const to = t.dataset.u;
    if (to !== S.units){
      liftsInProgram().forEach(function(l){
        if (S.max[l]) S.max[l] = roundW(conv(S.max[l], S.units), to);
      });
      S.units = to; save(); render(); settingsDrawer();
    }
    return;
  }
  if (t.id === "fCsvSample"){ downloadSample(); return; }
  if (t.id === "fBackupDownload"){ downloadBackup(); settingsDrawer(); return; }
  if (t.id === "fBackupNow"){ downloadBackup(); return; }
  if (t.id === "fImportFile"){ $("#fBackupFile").click(); return; }
  if (t.id === "fCsvLoad"){
    const txt = $("#fCsvPaste").value;
    if (!txt.trim()){ toast("Paste some CSV text first"); return; }
    applyCSV(txt, "pasted program");
    return;
  }
  if (t.id === "fNewCycle"){
    if (t.dataset.armed){
      S.cycle++;
      const wks = weeksInProgram();
      S.week = wks.length ? wks[0] : 1;
      S.day = daysInWeek(S.week)[0] || 1;
      S.actual = {};
      save(); render(); settingsDrawer(); toast("Cycle " + S.cycle);
    } else {
      t.dataset.armed = "1"; t.textContent = "Tap again to confirm";
    }
    return;
  }
  if (t.id === "fExport"){ exportDrawer(); return; }
  if (t.id === "fImport"){ importDrawer(); return; }
  if (t.id === "xCopy"){
    const ta = $("#xText");
    ta.select(); ta.setSelectionRange(0, 999999);
    const markBackedUp = function(){
      S.lastBackup = Date.now(); save();
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(
        function(){ markBackedUp(); toast("Copied"); },
        function(){ toast("Select and copy manually"); });
    } else {
      let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
      if (ok) markBackedUp();
      toast(ok ? "Copied" : "Select and copy manually");
    }
    return;
  }
  if (t.id === "iGo"){
    try { restoreFromData(JSON.parse($("#iText").value.trim())); }
    catch(e){ toast("That is not a valid backup"); }
    return;
  }
  if (t.id === "fWipe"){
    if (t.dataset.armed){
      S = fresh(); applyTheme(); save(); closeDrawer(); render(); toast("Erased");
    } else {
      t.dataset.armed = "1"; t.textContent = "Tap again to erase";
    }
    return;
  }
});

/* ============================================================
   EVENTS — typing / file input
   ============================================================ */
document.addEventListener("input", function(ev){
  const el = ev.target;

  if (el.id === "fCsvFile" && el.files && el.files[0]){
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = function(){ applyCSV(String(reader.result), file.name); };
    reader.onerror = function(){ toast("Could not read that file"); };
    reader.readAsText(file);
    return;
  }

  if (el.id === "fBackupFile" && el.files && el.files[0]){
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = function(){
      try { restoreFromData(JSON.parse(String(reader.result))); }
      catch(e){ toast("That is not a valid backup file"); }
    };
    reader.onerror = function(){ toast("Could not read that file"); };
    reader.readAsText(file);
    return;
  }

  if (el.dataset.k !== undefined && el.dataset.f !== undefined){
    const k = el.dataset.k, f = el.dataset.f, v = el.value.trim();
    if (!S.actual[k]) S.actual[k] = {};
    if (v === "") delete S.actual[k][f]; else S.actual[k][f] = v;
    if (!S.actual[k].w && !S.actual[k].r) delete S.actual[k];
    el.classList.toggle("filled", v !== "");

    const row = S.program.find(function(r){ return setKey(r) === k; });
    if (row){
      syncEntry(row);
      const statEl = el.closest(".setwrap").querySelector(".stat");
      const logged = !!S.log[k];
      if (statEl){
        statEl.textContent = logged ? "Logged" : "—";
        statEl.className = "stat" + (logged ? " saved" : "");
      }
    }
    save();
    return;
  }

  if (el.dataset.theme !== undefined){
    S.theme = Object.assign({}, DEFAULT_THEME, S.theme);
    S.theme[el.dataset.theme] = el.value;
    applyTheme(); save();
    return;
  }

  if (el.dataset.max !== undefined){
    const l = el.dataset.max;
    S.max[l] = parseFloat(el.value) || 0;
    const cv = $('[data-cv="'+CSS.escape(l)+'"]');
    if (cv) cv.textContent = S.max[l] ? fmt(conv(S.max[l], S.units))+" "+other(S.units) : "";
    save(); render();
    return;
  }
});

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){ await load(); applyTheme(); render(); })();
</script>
</body>
</html>
